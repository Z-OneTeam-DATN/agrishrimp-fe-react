version: "3.8"

services:
  agrishrimp-webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* phải truyền lúc build (baked vào JS bundle)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_BACKEND_ORIGIN=${NEXT_PUBLIC_BACKEND_ORIGIN}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    image: agrishrimp-webapp:latest
    container_name: agrishrimp-webapp
    ports:
      - "3004:3004"
    environment:
      # NEXT_PUBLIC_* (runtime — Next.js standalone cần lại)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_BACKEND_ORIGIN=${NEXT_PUBLIC_BACKEND_ORIGIN}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      # Server-side only (không expose ra browser)
      - JAVA_API_URL=${JAVA_API_URL:-http://api:8004/api}
      - GHN_TOKEN=${GHN_TOKEN}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - agrishrimp-net
      - agrishrimp-be-spring-webapp_default

networks:
  agrishrimp-net:
    external: true
  agrishrimp-be-spring-webapp_default:
    external: true
