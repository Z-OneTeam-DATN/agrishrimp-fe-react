name: Deploy Frontend (agrishrimp-web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: z-oneteam-datn/agrishrimp-fe-react
  APP_PORT: 3004

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build + Push image (GitHub-hosted cloud)
  # NEXT_PUBLIC_* bake vào image lúc build — không inject được runtime
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BACKEND_ORIGIN=${{ secrets.NEXT_PUBLIC_BACKEND_ORIGIN }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Deploy (self-hosted runner trên máy)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy on Server
    runs-on: [self-hosted, linux, agrishrimp]
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull & restart webapp
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -e
          cd /home/bnhien40/agrishrimp

          CURRENT_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' agrishrimp-webapp 2>/dev/null || echo "none")

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker pull "$IMAGE:latest"

          docker compose -f docker-compose.prod.yml up -d --no-deps --pull never webapp

          echo "Waiting for Next.js..."
          sleep 10

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ env.APP_PORT }} || echo "000")
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              echo "✅ Health check passed (HTTP $CODE)"
              exit 0
            fi
            echo "⏳ $i/$RETRIES — HTTP $CODE. Retry in 5s..."
            sleep 5
          done

          echo "❌ Health check failed. Rolling back..."
          if [ "$CURRENT_IMAGE" != "none" ]; then
            docker tag "$CURRENT_IMAGE" "$IMAGE:latest" 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never webapp
            echo "⏮️  Rolled back"
          fi
          exit 1
