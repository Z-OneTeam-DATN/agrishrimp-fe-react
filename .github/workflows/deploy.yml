name: Deploy Frontend (agrishrimp-web)

on:
  push:
    branches: [main]
  workflow_dispatch:        # cho phép trigger thủ công

concurrency:
  group: deploy-frontend
  cancel-in-progress: false  # không cancel deploy đang chạy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agrishrimp-fe-react
  APP_PORT: 3004
  SERVICE_NAME: webapp

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build + Push Docker image lên GHCR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* phải bake vào image lúc build — KHÔNG thể inject runtime
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BACKEND_ORIGIN=${{ secrets.NEXT_PUBLIC_BACKEND_ORIGIN }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Deploy lên VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/agrishrimp

            # Lưu tag hiện tại để rollback nếu cần
            CURRENT_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' agrishrimp-webapp 2>/dev/null || echo "none")
            echo "Current image: $CURRENT_IMAGE"

            # Auth GHCR (dùng PAT read:packages)
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull image mới
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Restart chỉ service webapp — không ảnh hưởng db/redis/api
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never webapp

            # Chờ container khởi động
            echo "Waiting for webapp to start..."
            sleep 10

            # ── Health check ──────────────────────────────
            RETRIES=5
            for i in $(seq 1 $RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ env.APP_PORT }})
              if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 301 ] || [ "$HTTP_CODE" -eq 302 ]; then
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                exit 0
              fi
              echo "⏳ Attempt $i/$RETRIES failed (HTTP $HTTP_CODE). Retrying in 5s..."
              sleep 5
            done

            # ── Auto-rollback nếu health check thất bại ──
            echo "❌ Health check failed after $RETRIES attempts. Rolling back..."
            if [ "$CURRENT_IMAGE" != "none" ]; then
              docker tag "$CURRENT_IMAGE" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d --no-deps --pull never webapp
              echo "⏮️  Rolled back to previous image"
            fi
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy frontend FAILED. Check VPS logs: docker logs agrishrimp-webapp"
